name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Tool
        run: npm install hbh-web2app
        
      - name: Build APK
        run: |
          node -e "
          const { GenerateApp } = require('hbh-web2app');
          GenerateApp({
            appName: 'ARMY-CONNECT',
            packageName: 'com.army.connect',
            asset: './army-connect-source.zip'
          });
          "
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: output/**/*.apk
