name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Source
        run: |
          mkdir -p www
          unzip army-connect-source.zip -d www/
          
      - name: Setup Bubblewrap (Google Tool)
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest https://raw.githubusercontent.com/GoogleChromeLabs/bubblewrap/main/packages/cli/src/spec/manifest.json || true
          
      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          bubblewrap build --directory . --skipPwaValidation
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "*.apk"
