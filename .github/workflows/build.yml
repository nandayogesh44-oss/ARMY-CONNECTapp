name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Source
        run: |
          mkdir -p www
          unzip army-connect-source.zip -d www/
          
      - name: Setup Bubblewrap & Manifest
        run: |
          npm install -g @bubblewrap/cli
          
          # Yeh line manifest file banayegi taaki error na aaye
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.army.connect",
            "host": "armyconnect.local",
            "name": "ARMY-CONNECT",
            "launcherName": "ARMY-CONNECT",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#000000",
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/GoogleChromeLabs/bubblewrap/main/packages/core/src/spec/icon512.png",
            "webManifestUrl": "https://raw.githubusercontent.com/GoogleChromeLabs/bubblewrap/main/packages/core/src/spec/manifest.json",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webviewFallback": false
          }
          EOF
          
      - name: Build APK
        run: |
          yes | bubblewrap build --directory . --skipPwaValidation
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "*.apk"
